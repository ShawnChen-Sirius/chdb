<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">chDB Durable serverless and latency numbers</title>
  <desc id="desc">Cards compare short-lived compute startup numbers and local versus remote query latency.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111e"/>
      <stop offset="0.5" stop-color="#080d15"/>
      <stop offset="1" stop-color="#05111a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f8cff"/>
      <stop offset="1" stop-color="#62e2ff"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9b3d"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d17a"/>
      <stop offset="1" stop-color="#a7f36c"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font: 800 46px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .sub { font: 500 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9aa8bb; }
      .label { font: 800 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .12em; fill: #8fa2b8; text-transform: uppercase; }
      .name { font: 800 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #eef5ff; }
      .small { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #aeb9c9; }
      .metric { font: 900 52px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .metricSmall { font: 900 36px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .metricLabel { font: 800 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #92a5bb; letter-spacing: .08em; text-transform: uppercase; }
      .mono { font: 700 18px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #dbe7f5; }
      .tiny { font: 800 12px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #9ed8ff; letter-spacing: .03em; }
    </style>
  </defs>

  <rect width="1440" height="760" fill="url(#bg)"/>
  <g opacity="0.18">
    <path d="M44 100 H1396 M44 180 H1396 M44 260 H1396 M44 340 H1396 M44 420 H1396 M44 500 H1396 M44 580 H1396" stroke="#173554"/>
    <path d="M120 40 V710 M240 40 V710 M360 40 V710 M480 40 V710 M600 40 V710 M720 40 V710 M840 40 V710 M960 40 V710 M1080 40 V710 M1200 40 V710 M1320 40 V710" stroke="#173554"/>
  </g>

  <text x="64" y="76" class="title">Run anywhere cheap, keep only the result</text>
  <text x="64" y="114" class="sub">Durable lets short-lived compute disappear while the analytical state remains in the bucket.</text>

  <rect x="64" y="164" width="470" height="330" rx="22" fill="#0e1724" stroke="#21415f" stroke-width="2"/>
  <g filter="url(#glow)">
    <rect x="168" y="220" width="262" height="168" rx="24" fill="#07131d" stroke="#2f8cff" stroke-width="2"/>
    <path d="M299 220 V198" stroke="#2f8cff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="299" cy="190" r="7" fill="#62e2ff"/>
    <path d="M168 304 H142 M430 304 H456" stroke="#2f8cff" stroke-width="4" stroke-linecap="round"/>

    <rect x="212" y="240" width="174" height="112" rx="28" fill="#0d1b2a" stroke="#2f8cff" stroke-width="2"/>
    <circle cx="258" cy="292" r="13" fill="#62e2ff"/>
    <circle cx="340" cy="292" r="13" fill="#62e2ff"/>
    <path d="M278 322 H320" stroke="#8ff7ff" stroke-width="5" stroke-linecap="round"/>
    <path d="M232 270 H366" stroke="#163c63" stroke-width="2"/>

    <rect x="224" y="360" width="150" height="40" rx="13" fill="#101d2b" stroke="#254465" stroke-width="2"/>
    <ellipse cx="253" cy="376" rx="17" ry="7" fill="#0c2637" stroke="#62e2ff" stroke-width="2"/>
    <path d="M236 376 V390 C236 394 244 398 253 398 C262 398 270 394 270 390 V376" fill="#0c2637" stroke="#62e2ff" stroke-width="2"/>
    <text x="286" y="384" class="tiny">agent</text>
    <text x="286" y="397" class="tiny" fill="#a7f36c">chDB</text>
  </g>
  <text x="299" y="428" class="name" text-anchor="middle">chDB analyst agent</text>
  <text x="299" y="462" class="small" text-anchor="middle">local chDB + Durable object</text>
  <path d="M446 303 C496 303 500 242 558 242" stroke="url(#blue)" stroke-width="5" fill="none" filter="url(#glow)"/>
  <path d="M446 303 C496 303 500 346 558 346" stroke="url(#blue)" stroke-width="5" fill="none" filter="url(#glow)"/>
  <path d="M446 303 C496 303 500 450 558 450" stroke="url(#blue)" stroke-width="5" fill="none" filter="url(#glow)"/>
  <path d="M548 232 L566 242 L548 252 M548 336 L566 346 L548 356 M548 440 L566 450 L548 460" stroke="#62e2ff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <g>
    <rect x="584" y="184" width="792" height="94" rx="16" fill="#111923" stroke="#6f4b18" stroke-width="2"/>
    <text x="616" y="222" class="label" fill="#ffbd59">AWS Lambda</text>
    <text x="616" y="258" class="small">warm /query</text>
    <text x="760" y="260" class="metricSmall" fill="#ffd166">255 ms</text>
    <text x="1032" y="258" class="small">cold start</text>
    <text x="1176" y="260" class="metricSmall" fill="#ffd166">34 s</text>
  </g>
  <g>
    <rect x="584" y="310" width="792" height="94" rx="16" fill="#0d1728" stroke="#224d85" stroke-width="2"/>
    <text x="616" y="348" class="label" fill="#69b9ff">Lambda MicroVM</text>
    <text x="616" y="384" class="small">snapshot start</text>
    <text x="780" y="386" class="metricSmall" fill="#69b9ff">4 s</text>
    <text x="1032" y="384" class="small">1M row GROUP BY</text>
    <text x="1208" y="386" class="metricSmall" fill="#69b9ff">12 ms</text>
  </g>
  <g>
    <rect x="584" y="436" width="792" height="94" rx="16" fill="#0c1d1b" stroke="#1c6b55" stroke-width="2"/>
    <text x="616" y="474" class="label" fill="#81f2b0">E2B sandbox</text>
    <text x="820" y="484" class="metricLabel" text-anchor="middle">create</text>
    <text x="820" y="522" class="metricSmall" fill="#a7f36c" text-anchor="middle">1.2 s</text>
    <text x="1020" y="484" class="metricLabel" text-anchor="middle">pause</text>
    <text x="1020" y="522" class="metricSmall" fill="#a7f36c" text-anchor="middle">0.3 s</text>
    <text x="1220" y="484" class="metricLabel" text-anchor="middle">resume</text>
    <text x="1220" y="522" class="metricSmall" fill="#a7f36c" text-anchor="middle">0.5 s</text>
  </g>

  <rect x="64" y="574" width="1312" height="110" rx="20" fill="#0e1724" stroke="#263b55" stroke-width="2"/>
  <text x="96" y="614" class="label">hot path latency: local process vs remote database</text>
  <text x="96" y="654" class="mono">local p50 1.1 ms / p99 2.8 ms</text>
  <rect x="430" y="636" width="120" height="18" rx="9" fill="url(#green)"/>
  <text x="680" y="654" class="mono">remote p50 63 ms / p99 450 ms to 2 s</text>
  <rect x="1080" y="636" width="248" height="18" rx="9" fill="url(#orange)"/>
</svg>
