<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
  <title id="title">Open one object, then make local state durable</title>
  <desc id="desc">A clean sequence diagram with lifelines for Application, Local chDB, WAL buffer, Object storage, and New machine. It shows execute, flush, checkpoint, cold open, replay, and return boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#07131d"/>
    </linearGradient>
    <pattern id="grid" width="96" height="78" patternUnits="userSpaceOnUse">
      <path d="M 96 0 L 0 0 0 78" fill="none" stroke="#16314d" stroke-width="1" opacity=".22"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#02050a" flood-opacity=".35"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10.4" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1.5 1.5 L 10.5 6 L 1.5 10.5" fill="none" stroke="#62d8ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 12 12" refX="10.4" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1.5 1.5 L 10.5 6 L 1.5 10.5" fill="none" stroke="#ffd166" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 12 12" refX="10.4" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1.5 1.5 L 10.5 6 L 1.5 10.5" fill="none" stroke="#a7f36c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowReturn" viewBox="0 0 12 12" refX="10.4" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 1.5 1.5 L 10.5 6 L 1.5 10.5" fill="none" stroke="#91a5bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 900 52px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f7fbff; letter-spacing: -1.8px; }
      .subtitle { font: 700 21px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #a9b8cb; }
      .actor { font: 900 19px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f3f8ff; }
      .actorSub { font: 800 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9fb0c5; }
      .label { font: 850 15.5px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #d8e7f6; }
      .labelSmall { font: 800 13.5px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #aebdd0; }
      .mono { font: 850 15px "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; fill: #e7f1ff; }
      .blue { fill: #8ecbff; }
      .green { fill: #a7f36c; }
      .amber { fill: #ffd166; }
      .card { fill: #101926; stroke: #2b577c; stroke-width: 2; }
      .cardAmber { fill: #171a1d; stroke: #9b690f; stroke-width: 2; }
      .cardGreen { fill: #0e1d1a; stroke: #23834d; stroke-width: 2; }
      .lifeline { stroke: #2b5a82; stroke-width: 1.6; stroke-dasharray: 7 9; opacity: .86; }
      .activate { fill: #10243a; stroke: #3f82b9; stroke-width: 1.3; opacity: .78; }
      .activateAmber { fill: #332711; stroke: #b9851d; stroke-width: 1.3; opacity: .8; }
      .activateGreen { fill: #14311f; stroke: #3c9d55; stroke-width: 1.3; opacity: .8; }
    </style>
  </defs>

  <rect width="1440" height="940" fill="url(#bg)"/>
  <rect x="42" y="40" width="1356" height="842" fill="url(#grid)" opacity=".65"/>
  <path d="M 54 136 H 1388" stroke="#173554" stroke-width="1.2" opacity=".8"/>

  <text x="70" y="86" class="title">Open one object, then make local state durable</text>
  <text x="70" y="122" class="subtitle">A sequence view: who calls whom, when object storage becomes authoritative, and when the call returns.</text>

  <g filter="url(#soft)">
    <rect x="55" y="158" width="210" height="72" rx="18" class="card"/>
    <text x="160" y="187" class="actor" text-anchor="middle">Application</text>
    <text x="160" y="211" class="actorSub" text-anchor="middle">agent / app code</text>

    <rect x="325" y="158" width="210" height="72" rx="18" class="card"/>
    <text x="430" y="187" class="actor" text-anchor="middle">Local chDB</text>
    <text x="430" y="211" class="actorSub" text-anchor="middle">MergeTree working copy</text>

    <rect x="595" y="158" width="210" height="72" rx="18" class="card"/>
    <text x="700" y="187" class="actor" text-anchor="middle">WAL buffer</text>
    <text x="700" y="211" class="actorSub" text-anchor="middle">statement log</text>

    <rect x="855" y="158" width="250" height="72" rx="18" class="cardAmber"/>
    <text x="980" y="187" class="actor" text-anchor="middle">Object storage</text>
    <text x="980" y="211" class="actorSub" text-anchor="middle">bucket + head.json</text>

    <rect x="1145" y="158" width="210" height="72" rx="18" class="cardGreen"/>
    <text x="1250" y="187" class="actor" text-anchor="middle">New machine</text>
    <text x="1250" y="211" class="actorSub" text-anchor="middle">cold open + replay</text>
  </g>

  <path class="lifeline" d="M 160 230 V 850"/>
  <path class="lifeline" d="M 430 230 V 850"/>
  <path class="lifeline" d="M 700 230 V 850"/>
  <path class="lifeline" d="M 980 230 V 850"/>
  <path class="lifeline" d="M 1250 230 V 850"/>

  <rect x="414" y="266" width="32" height="510" rx="10" class="activate"/>
  <rect x="684" y="346" width="32" height="44" rx="10" class="activate"/>
  <rect x="964" y="486" width="32" height="300" rx="10" class="activateAmber"/>
  <rect x="1234" y="786" width="32" height="72" rx="10" class="activateGreen"/>

  <path d="M 160 278 H 414" fill="none" stroke="#62d8ff" stroke-width="3.4" marker-end="url(#arrowBlue)"/>
  <text x="287" y="264" class="mono" text-anchor="middle"><tspan class="blue">execute</tspan>(INSERT ...)</text>

  <path d="M 446 324 C 520 324 520 354 446 354" fill="none" stroke="#62d8ff" stroke-width="3.2" marker-end="url(#arrowBlue)"/>
  <text x="548" y="323" class="label" text-anchor="middle">run statement locally</text>

  <path d="M 446 380 H 684" fill="none" stroke="#62d8ff" stroke-width="3.2" marker-end="url(#arrowBlue)"/>
  <text x="565" y="366" class="label" text-anchor="middle">append statement WAL</text>

  <path d="M 414 428 H 170" fill="none" stroke="#91a5bd" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrowReturn)"/>
  <text x="292" y="414" class="labelSmall" text-anchor="middle"><tspan class="blue">execute</tspan> returns: local only</text>

  <path d="M 160 476 H 414" fill="none" stroke="#a7f36c" stroke-width="3.4" marker-end="url(#arrowGreen)"/>
  <text x="287" y="462" class="mono" text-anchor="middle"><tspan class="green">flush</tspan>()</text>

  <path d="M 446 520 H 964" fill="none" stroke="#ffd166" stroke-width="3.2" marker-end="url(#arrowAmber)"/>
  <text x="705" y="506" class="label" text-anchor="middle">PUT WAL segment</text>

  <path d="M 446 568 H 964" fill="none" stroke="#ffd166" stroke-width="3.2" marker-end="url(#arrowAmber)"/>
  <text x="705" y="554" class="label" text-anchor="middle">CAS <tspan class="amber">head.json</tspan> with ETag / If-Match</text>

  <path d="M 964 614 H 446" fill="none" stroke="#91a5bd" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrowReturn)"/>
  <text x="705" y="600" class="labelSmall" text-anchor="middle">new ETag / seq published</text>

  <path d="M 414 658 H 170" fill="none" stroke="#91a5bd" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrowReturn)"/>
  <text x="292" y="644" class="labelSmall" text-anchor="middle"><tspan class="green">flush()</tspan> returns: WAL durable</text>

  <path d="M 160 704 H 414" fill="none" stroke="#a7f36c" stroke-width="3.4" marker-end="url(#arrowGreen)"/>
  <text x="287" y="690" class="mono" text-anchor="middle"><tspan class="green">checkpoint</tspan>()</text>

  <path d="M 446 750 H 964" fill="none" stroke="#ffd166" stroke-width="3.2" marker-end="url(#arrowAmber)"/>
  <text x="705" y="736" class="label" text-anchor="middle">PUT base snapshot + CAS <tspan class="amber">head.json</tspan></text>

  <path d="M 964 792 H 446" fill="none" stroke="#91a5bd" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrowReturn)"/>
  <text x="705" y="780" class="labelSmall" text-anchor="middle">base published; folded WAL needs no replay</text>

  <path d="M 1250 802 H 996" fill="none" stroke="#62d8ff" stroke-width="3.2" marker-end="url(#arrowBlue)"/>
  <text x="1123" y="788" class="label" text-anchor="middle">cold open: read <tspan class="amber">head.json</tspan></text>

  <path d="M 996 836 H 1234" fill="none" stroke="#91a5bd" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrowReturn)"/>
  <text x="1115" y="822" class="labelSmall" text-anchor="middle">base + remaining WAL refs</text>

  <path d="M 1266 866 C 1338 866 1338 892 1266 892" fill="none" stroke="#a7f36c" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="1122" y="880" class="labelSmall" text-anchor="middle">restore + replay; open returns</text>
</svg>
